<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BoardMate — настільні ігри</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="label">Знайди гру для своєї компанії</p>
        <h1>BoardMate<span aria-hidden="true">.</span></h1>
        <p>Каталог настільних ігор</p>
      </header>
      <p id="status" role="status" aria-live="polite">Завантаження ігор…</p>
      <div class="table-wrapper">
        <table>
          <caption>
            Ігри з каталогу BoardMate
          </caption>
          <thead>
            <tr>
              <th scope="col">Гра</th>
              <th scope="col">Опис</th>
              <th scope="col">Гравці</th>
              <th scope="col">Час</th>
            </tr>
          </thead>
          <tbody id="games"></tbody>
        </table>
      </div>
      <nav aria-label="Сторінки каталогу">
        <button id="previous" type="button" disabled>← Назад</button>
        <span id="page">Сторінка 1</span>
        <button id="next" type="button" disabled>Далі →</button>
        <button id="reload" type="button">Оновити</button>
      </nav>
    </main>
  </body>
</html>
